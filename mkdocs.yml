site_name: Solar Flare Documentation
theme:
  name: material
  palette:
    scheme: default
    primary: blue
    accent: orange
  features:
    - navigation.instant
    - navigation.expand

docs_dir: docs
exclude_docs: |
  planning/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: index.md
  
  - Pipeline Stages:
    - data-single: stages/data-single.md
    - create-distribution: stages/create-distribution.md
    - confusion-matrix-val: stages/confusion-matrix-val.md
    - prediction-plots: stages/prediction-plots.md
    - plot-class-dist: stages/plot-class-dist.md
    - plot_contour_image_grid: stages/plot_contour_image_grid.md
    - attribution_analysis: stages/attribution_analysis.md
    - create_movie: stages/create_movie.md
    - xgb-feat-importance: stages/xgb-feat-importance.md
    - kshap-stats: stages/kshap-stats.md
    - kshap-analyze: stages/kshap-analyze.md

  - Subset Pipeline Stages:
    - subset-data: stages/subset-data.md
    - subset-confusion-matrix: stages/subset-confusion-matrix.md
    - subset-create-distribution: stages/subset-create-distribution.md
    - subset-plot-class-dist: stages/subset-plot-class-dist.md
    - subset-prediction-plots: stages/subset-prediction-plots.md
    - subset-attribution-analysis: stages/subset-attribution-analysis.md
    - subset-contour-grid: stages/subset-contour-grid.md
    - subset-raw-movies: stages/subset-raw-movies.md
    - subset-attribution-movies: stages/subset-attribution-movies.md
    - subset-contour-grid-movies: stages/subset-contour-grid-movies.md

  - Code Documentation:
    - Stage Scripts:
      - predictions_analyze: code/predictions_analyze.md
      - plot_class_wise_distribution: code/plot_class_wise_distribution.md
      - plot_contour_image_grid: code/plot_contour_image_grid.md
      - create_movies: code/create_movies.md
      - attributions_analyze: code/attributions_analyze.md
      - test: code/test.md
      - class_wise_distribution: code/class_wise_distribution.md
      - kshap: code/kshap.md
      - analyze_shap: code/analyze_shap.md
      - data_single: code/data_single.md
      - xgb_feat_importance: code/xgb_feat_importance.md
      - create_raw_movie: code/create_raw_movie.md
      - create_contour_grid_movie: code/create_contour_grid_movie.md
      - aarp_subset_pipeline: code/aarp_subset_pipeline.md
    - Shared Utilities:
      - ig: code/ig.md
      - utils: code/utils.md
      - train: code/train.md
  
  - Pipeline Details: pipeline_details.md
