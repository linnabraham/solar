# Experiment registry (paper/experiments.yaml) drives the exp-* stages below:
# every experiment = (checkpoint × stats × dataset JSON), outputs land in
# artifacts/<exp-id>/ and metrics/<exp-id>/. See paper/battery.yaml for what
# each artifact means. Tier membership is edited in the registry, not here.
vars:
  - paper/experiments.yaml

stages:
  # ── Per-experiment battery stages (foreach over registry tiers) ────────────

  exp-eval-test:
    foreach: ${tier_core}
    do:
      cmd: >-
        python -m src.torch.vit.test --subset test
        --trained-model ${item.checkpoint}
        --json-path ${item.json}
        --stats-file ${item.stats}
        ${item.channels_args}
        ${item.model_type_args}
        --output-path artifacts/${key}/cm_test.png
        --metrics-out metrics/${key}/scores_test.json
      deps:
      - ${item.checkpoint}
      - ${item.json}
      - ${item.stats}
      - src/torch/vit/test.py
      - src/torch/vit/utils.py
      outs:
      - artifacts/${key}/cm_test.png
      metrics:
      - metrics/${key}/scores_test.json:
          cache: false

  exp-eval-validation:
    foreach: ${tier_core}
    do:
      cmd: >-
        python -m src.torch.vit.test --subset validation
        --trained-model ${item.checkpoint}
        --json-path ${item.json}
        --stats-file ${item.stats}
        ${item.channels_args}
        ${item.model_type_args}
        --output-path artifacts/${key}/cm_validation.png
        --metrics-out metrics/${key}/scores_validation.json
      deps:
      - ${item.checkpoint}
      - ${item.json}
      - ${item.stats}
      - src/torch/vit/test.py
      - src/torch/vit/utils.py
      outs:
      - artifacts/${key}/cm_validation.png
      metrics:
      - metrics/${key}/scores_validation.json:
          cache: false

  # ROC curve vs the fixed XGBoost baseline (paper/experiments.yaml's
  # xgboost_baseline) -- promoted from compare_models.py's manual/pairwise
  # CLI into a per-experiment stage. Also produces a bonus AR-level CM
  # comparison and a metrics table (compare_models.py's other two outputs),
  # not just the ROC curve battery.yaml originally asked for.
  exp-roc:
    foreach: ${tier_core}
    do:
      cmd: >-
        python -m src.torch.vit.compare_models
        --vit-path ${item.checkpoint}
        --xgb-path ${xgboost_baseline.checkpoint}
        --subset test
        --json-path ${item.json}
        --stats-file ${item.stats}
        ${item.model_type_args}
        --output-dir artifacts/${key}/roc_test
      deps:
      - ${item.checkpoint}
      - ${xgboost_baseline.checkpoint}
      - ${item.json}
      - ${item.stats}
      - src/torch/vit/compare_models.py
      - src/torch/vit/evaluate_aarp.py
      - src/torch/vit/utils.py
      outs:
      - artifacts/${key}/roc_test

  # Standalone ViT-only ROC/CM/metrics -- no XGBoost pairing, for when the
  # comparison against the baseline isn't wanted, just the model's own curve.
  exp-roc-solo:
    foreach: ${tier_core}
    do:
      cmd: >-
        python -m src.torch.vit.compare_models
        --vit-path ${item.checkpoint}
        --subset test
        --json-path ${item.json}
        --stats-file ${item.stats}
        ${item.model_type_args}
        --output-dir artifacts/${key}/roc_solo_test
      deps:
      - ${item.checkpoint}
      - ${item.json}
      - ${item.stats}
      - src/torch/vit/compare_models.py
      - src/torch/vit/evaluate_aarp.py
      - src/torch/vit/utils.py
      outs:
      - artifacts/${key}/roc_solo_test

  # IG attribution sections run on BOTH test and validation: with only ~17
  # positive AARPs total, the two splits can tell different stories and the
  # reports must show whether the channel/attribution findings hold on each.
  exp-ig-attributions-test:
    foreach: ${tier_explain}
    do:
      cmd: >-
        python -m src.torch.vit.class_wise_distribution
        --subset test
        --json-path ${item.json}
        --model-path ${item.checkpoint}
        --stats-file ${item.stats}
        ${item.channels_args}
        ${item.model_type_args}
        --output-neg artifacts/${key}/attributions_neg_test.pt
        --output-pos artifacts/${key}/attributions_pos_test.pt
      deps:
      - ${item.checkpoint}
      - ${item.json}
      - ${item.stats}
      - src/torch/vit/class_wise_distribution.py
      - src/torch/vit/ig.py
      - src/torch/vit/utils.py
      outs:
      - artifacts/${key}/attributions_neg_test.pt:
          cache: false
      - artifacts/${key}/attributions_pos_test.pt:
          cache: false

  exp-ig-attributions-validation:
    foreach: ${tier_explain}
    do:
      cmd: >-
        python -m src.torch.vit.class_wise_distribution
        --subset validation
        --json-path ${item.json}
        --model-path ${item.checkpoint}
        --stats-file ${item.stats}
        ${item.channels_args}
        ${item.model_type_args}
        --output-neg artifacts/${key}/attributions_neg_validation.pt
        --output-pos artifacts/${key}/attributions_pos_validation.pt
      deps:
      - ${item.checkpoint}
      - ${item.json}
      - ${item.stats}
      - src/torch/vit/class_wise_distribution.py
      - src/torch/vit/ig.py
      - src/torch/vit/utils.py
      outs:
      - artifacts/${key}/attributions_neg_validation.pt:
          cache: false
      - artifacts/${key}/attributions_pos_validation.pt:
          cache: false

  exp-ig-distribution-plots-test:
    foreach: ${tier_explain}
    do:
      cmd: >-
        python -m src.torch.vit.plot_class_wise_distribution
        --subset test
        --json-path ${item.json}
        --attributions-neg artifacts/${key}/attributions_neg_test.pt
        --attributions-pos artifacts/${key}/attributions_pos_test.pt
        --output-dir artifacts/${key}/distribution_test
        ${item.channels_args}
      deps:
      - artifacts/${key}/attributions_neg_test.pt
      - artifacts/${key}/attributions_pos_test.pt
      - ${item.json}
      - src/torch/vit/plot_class_wise_distribution.py
      - src/torch/vit/class_wise_distribution.py
      - src/torch/vit/ig.py
      - src/torch/vit/utils.py
      outs:
      - artifacts/${key}/distribution_test

  exp-ig-distribution-plots-validation:
    foreach: ${tier_explain}
    do:
      cmd: >-
        python -m src.torch.vit.plot_class_wise_distribution
        --subset validation
        --json-path ${item.json}
        --attributions-neg artifacts/${key}/attributions_neg_validation.pt
        --attributions-pos artifacts/${key}/attributions_pos_validation.pt
        --output-dir artifacts/${key}/distribution_validation
        ${item.channels_args}
      deps:
      - artifacts/${key}/attributions_neg_validation.pt
      - artifacts/${key}/attributions_pos_validation.pt
      - ${item.json}
      - src/torch/vit/plot_class_wise_distribution.py
      - src/torch/vit/class_wise_distribution.py
      - src/torch/vit/ig.py
      - src/torch/vit/utils.py
      outs:
      - artifacts/${key}/distribution_validation

  # Exemplar AARPs below must stay in sync with exemplar_aarps in
  # paper/experiments.yaml (flaring: 377, 1449; non-flaring: 2026, 4296).
  exp-contour-grids:
    foreach: ${tier_explain}
    do:
      cmd:
      - >-
        python -m src.torch.vit.plot_contour_image_grid
        --json-path ${item.json} --model-path ${item.checkpoint}
        --stats-file ${item.stats} ${item.channels_args} ${item.model_type_args}
        --aarp-id 377 --output-path artifacts/${key}/contour_grid/aarp377.png
      - >-
        python -m src.torch.vit.plot_contour_image_grid
        --json-path ${item.json} --model-path ${item.checkpoint}
        --stats-file ${item.stats} ${item.channels_args} ${item.model_type_args}
        --aarp-id 1449 --output-path artifacts/${key}/contour_grid/aarp1449.png
      - >-
        python -m src.torch.vit.plot_contour_image_grid
        --json-path ${item.json} --model-path ${item.checkpoint}
        --stats-file ${item.stats} ${item.channels_args} ${item.model_type_args}
        --aarp-id 2026 --output-path artifacts/${key}/contour_grid/aarp2026.png
      - >-
        python -m src.torch.vit.plot_contour_image_grid
        --json-path ${item.json} --model-path ${item.checkpoint}
        --stats-file ${item.stats} ${item.channels_args} ${item.model_type_args}
        --aarp-id 4296 --output-path artifacts/${key}/contour_grid/aarp4296.png
      deps:
      - ${item.checkpoint}
      - ${item.json}
      - ${item.stats}
      - src/torch/vit/plot_contour_image_grid.py
      - src/torch/vit/ig.py
      - src/torch/vit/utils.py
      outs:
      - artifacts/${key}/contour_grid

  exp-prediction-plots:
    foreach: ${tier_explain}
    do:
      cmd: >-
        python -m src.torch.vit.predictions_analyze
        --json-path ${item.json}
        --model-path ${item.checkpoint}
        --stats-file ${item.stats}
        ${item.channels_args}
        ${item.model_type_args}
        --output-dir artifacts/${key}/predictions
      deps:
      - ${item.checkpoint}
      - ${item.json}
      - ${item.stats}
      - src/torch/vit/ig.py
      - src/torch/vit/predictions_analyze.py
      outs:
      - artifacts/${key}/predictions

  exp-kshap-stats:
    foreach: ${tier_shap}
    do:
      cmd: >-
        python -m src.torch.vit.kshap --subset test
        --trained-model-path ${item.checkpoint}
        --json-path ${item.json}
        --stats-file ${item.stats}
        ${item.channels_args}
        ${item.model_type_args}
        --output-json artifacts/${key}/shap_stats_test.json
      deps:
      - ${item.checkpoint}
      - ${item.json}
      - ${item.stats}
      - src/torch/vit/kshap.py
      - aarp_ml/torch/dataset.py
      - aarp_ml/torch/model.py
      - src/torch/vit/utils.py
      outs:
      - artifacts/${key}/shap_stats_test.json

  exp-kshap-analyze:
    foreach: ${tier_shap}
    do:
      cmd: >-
        python -m src.torch.vit.analyze_shap --subset test
        --input-json artifacts/${key}/shap_stats_test.json
        --output-dir artifacts/${key}/kshap
      deps:
      - artifacts/${key}/shap_stats_test.json
      - src/torch/vit/analyze_shap.py
      outs:
      - artifacts/${key}/kshap

  exp-kshap-stats-validation:
    foreach: ${tier_shap}
    do:
      cmd: >-
        python -m src.torch.vit.kshap --subset validation
        --trained-model-path ${item.checkpoint}
        --json-path ${item.json}
        --stats-file ${item.stats}
        ${item.channels_args}
        ${item.model_type_args}
        --output-json artifacts/${key}/shap_stats_validation.json
      deps:
      - ${item.checkpoint}
      - ${item.json}
      - ${item.stats}
      - src/torch/vit/kshap.py
      - aarp_ml/torch/dataset.py
      - aarp_ml/torch/model.py
      - src/torch/vit/utils.py
      outs:
      - artifacts/${key}/shap_stats_validation.json

  exp-kshap-analyze-validation:
    foreach: ${tier_shap}
    do:
      cmd: >-
        python -m src.torch.vit.analyze_shap --subset validation
        --input-json artifacts/${key}/shap_stats_validation.json
        --output-dir artifacts/${key}/kshap_validation
      deps:
      - artifacts/${key}/shap_stats_validation.json
      - src/torch/vit/analyze_shap.py
      outs:
      - artifacts/${key}/kshap_validation

  # Higher-N variant of the SHAP battery (--max-samples 200 vs the default
  # 50) -- separate outputs, doesn't replace the default-N results above.
  # Not run for every tier_shap experiment by default; see ADR-0007.
  exp-kshap-stats-highn:
    foreach: ${tier_shap}
    do:
      cmd: >-
        python -m src.torch.vit.kshap --subset test
        --trained-model-path ${item.checkpoint}
        --json-path ${item.json}
        --stats-file ${item.stats}
        ${item.channels_args}
        ${item.model_type_args}
        --max-samples 200
        --output-json artifacts/${key}/shap_stats_highn_test.json
      deps:
      - ${item.checkpoint}
      - ${item.json}
      - ${item.stats}
      - src/torch/vit/kshap.py
      - aarp_ml/torch/dataset.py
      - aarp_ml/torch/model.py
      - src/torch/vit/utils.py
      outs:
      - artifacts/${key}/shap_stats_highn_test.json

  exp-kshap-analyze-highn:
    foreach: ${tier_shap}
    do:
      cmd: >-
        python -m src.torch.vit.analyze_shap --subset test
        --input-json artifacts/${key}/shap_stats_highn_test.json
        --output-dir artifacts/${key}/kshap_highn
      deps:
      - artifacts/${key}/shap_stats_highn_test.json
      - src/torch/vit/analyze_shap.py
      outs:
      - artifacts/${key}/kshap_highn

  exp-kshap-stats-highn-validation:
    foreach: ${tier_shap}
    do:
      cmd: >-
        python -m src.torch.vit.kshap --subset validation
        --trained-model-path ${item.checkpoint}
        --json-path ${item.json}
        --stats-file ${item.stats}
        ${item.channels_args}
        ${item.model_type_args}
        --max-samples 200
        --output-json artifacts/${key}/shap_stats_highn_validation.json
      deps:
      - ${item.checkpoint}
      - ${item.json}
      - ${item.stats}
      - src/torch/vit/kshap.py
      - aarp_ml/torch/dataset.py
      - aarp_ml/torch/model.py
      - src/torch/vit/utils.py
      outs:
      - artifacts/${key}/shap_stats_highn_validation.json

  exp-kshap-analyze-highn-validation:
    foreach: ${tier_shap}
    do:
      cmd: >-
        python -m src.torch.vit.analyze_shap --subset validation
        --input-json artifacts/${key}/shap_stats_highn_validation.json
        --output-dir artifacts/${key}/kshap_highn_validation
      deps:
      - artifacts/${key}/shap_stats_highn_validation.json
      - src/torch/vit/analyze_shap.py
      outs:
      - artifacts/${key}/kshap_highn_validation

  # ── Single-run / data stages ───────────────────────────────────────────────

  xgb-feat-importance:
    cmd: python -m src.torch.xgb_feat_importance --model-path outputs/devoted-pond-14/best_xgboost_model.json
    deps:
    - outputs/devoted-pond-14/best_xgboost_model.json
    - src/torch/xgb_feat_importance.py
    outs:
    - plots/xgb/devoted-pond-14/feat_importance_gain.png
    - plots/xgb/devoted-pond-14/feat_importance_weight.png
    - plots/xgb/devoted-pond-14/feat_importance_gain_top20.png

  create_movie:
    cmd: >-
      python -m src.torch.vit.create_movies
      --output-dir plots/attribution_movies
      --splits validation test
    deps:
    - outputs/glad-shape-197/trained_model.pth
    - solar_dataset.json
    - src/torch/vit/create_movies.py
    - src/torch/vit/ig.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/train.py
    - src/torch/vit/utils.py
    - stats.pkl
    outs:
    - plots/attribution_movies:
        cache: false

  attribution_analysis:
    cmd: python -m src.torch.vit.attributions_analyze --output-dir plots/attributions
    deps:
    - src/torch/vit/attributions_analyze.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/train.py
    - src/torch/vit/utils.py
    - aarp_ml/torch/model.py
    - aarp_ml/torch/dataset.py
    - aarp_ml/dataset.py
    - aarp_ml/torch/trained_model.py
    - solar_dataset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - plots/attributions

  data-single:
    cmd: python -m src.data_single --process --select
    deps:
    - data/GOES_event_list.csv
    - data/aarps_full_urlist.txt
    - data/all_harps_with_noaa_ars.txt
    - src/data_single.py
    outs:
    - data/combined_clean.csv
    - data/combined_dl_list.csv
    - data/combined_processed_df.csv
    - data/goes_df_aarp_id.csv
    - data/grouped_df.csv
    - data/neg_urls_selected_downloaded.csv
    - data/pos_urls_selected_downloaded.csv
    - data/shape_limited.csv

  # ── Subset pipeline stages ────────────────────────────────────────────────
  # Operates on a small locally-downloaded AARP subset (see src/aarp_subset_pipeline.py).
  # Run --download manually once before first dvc repro (external NASA fetch, not tracked).

  subset-data:
    cmd: python -m src.aarp_subset_pipeline --process --json
    deps:
    - src/aarp_subset_pipeline.py
    - data/grouped_df.csv
    - data/pos_urls_selected_downloaded.csv
    - data/neg_urls_selected_downloaded.csv
    - solar_dataset.json
    outs:
    - solar_dataset_subset.json

  subset-confusion-matrix:
    cmd: >-
      python -m src.torch.vit.test
      --subset test
      --json-path solar_dataset_subset.json
      --output-path plots/subset/cm.png
    deps:
    - src/torch/vit/test.py
    - solar_dataset_subset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - plots/subset/cm.png

  subset-prediction-plots:
    cmd: >-
      python -m src.torch.vit.predictions_analyze
      --json-path solar_dataset_subset.json
      --output-dir plots/subset/predictions
    deps:
    - src/torch/vit/predictions_analyze.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    - solar_dataset_subset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - plots/subset/predictions/377/goes_with_predictions.png
    - plots/subset/predictions/1449/goes_with_predictions.png
    - plots/subset/predictions/4296/goes_with_predictions.png
    - plots/subset/predictions/3563/goes_with_predictions.png
    - plots/subset/predictions/185/goes_with_predictions.png
    - plots/subset/predictions/1807/goes_with_predictions.png
    - plots/subset/predictions/903/goes_with_predictions.png

  subset-create-distribution:
    cmd: >-
      python -m src.torch.vit.class_wise_distribution
      --json-path solar_dataset_subset.json
      --output-neg data/intermediate-outs/subset_attributions_neg.pt
      --output-pos data/intermediate-outs/subset_attributions_pos.pt
    deps:
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    - solar_dataset_subset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - data/intermediate-outs/subset_attributions_neg.pt:
        cache: false
    - data/intermediate-outs/subset_attributions_pos.pt:
        cache: false

  subset-plot-class-dist:
    cmd: >-
      python -m src.torch.vit.plot_class_wise_distribution
      --json-path solar_dataset_subset.json
      --attributions-neg data/intermediate-outs/subset_attributions_neg.pt
      --attributions-pos data/intermediate-outs/subset_attributions_pos.pt
      --output-dir plots/subset/distribution
    deps:
    - src/torch/vit/plot_class_wise_distribution.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    - solar_dataset_subset.json
    - data/intermediate-outs/subset_attributions_neg.pt
    - data/intermediate-outs/subset_attributions_pos.pt
    outs:
    - plots/subset/distribution

  subset-attribution-analysis:
    cmd: >-
      python -m src.torch.vit.attributions_analyze
      --json-path solar_dataset_subset.json
      --output-dir plots/subset/attributions
    deps:
    - src/torch/vit/attributions_analyze.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/train.py
    - src/torch/vit/utils.py
    - aarp_ml/torch/model.py
    - aarp_ml/torch/dataset.py
    - aarp_ml/dataset.py
    - aarp_ml/torch/trained_model.py
    - solar_dataset_subset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - plots/subset/attributions

  subset-raw-movies:
    cmd: >-
      python -m src.torch.vit.create_raw_movie
      --json-path solar_dataset_subset.json
      --output-dir plots/subset/movies/raw
      --splits training validation test
    deps:
    - src/torch/vit/create_raw_movie.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    - solar_dataset_subset.json
    outs:
    - plots/subset/movies/raw:
        cache: false

  subset-attribution-movies:
    cmd: >-
      python -m src.torch.vit.create_movies
      --json-path solar_dataset_subset.json
      --output-dir plots/subset/movies/attribution
      --splits training validation test
    deps:
    - src/torch/vit/create_movies.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    - solar_dataset_subset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - plots/subset/movies/attribution:
        cache: false

  subset-contour-grid-movies:
    cmd: >-
      python -m src.torch.vit.create_contour_grid_movie
      --json-path solar_dataset_subset.json
      --output-dir plots/subset/movies/contour_grid
      --splits training validation test
    deps:
    - src/torch/vit/create_contour_grid_movie.py
    - src/torch/vit/plot_contour_image_grid.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    - solar_dataset_subset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - plots/subset/movies/contour_grid:
        cache: false

  subset-contour-grid:
    cmd: >-
      python -m src.torch.vit.plot_contour_image_grid
      --json-path solar_dataset_subset.json
      --aarp-id 377
      --output-path plots/subset/attribution_contour_grid.png
    deps:
    - src/torch/vit/plot_contour_image_grid.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    - solar_dataset_subset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - plots/subset/attribution_contour_grid.png
