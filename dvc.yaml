stages:
  prediction-plots:
    cmd: python -m src.torch.vit.predictions_analyze
    deps:
    - outputs/glad-shape-197/trained_model.pth
    - solar_dataset.json
    - stats.pkl
    - src/torch/vit/ig.py
    - src/torch/vit/predictions_analyze.py
    outs:
    - plots/predictions/1275/goes_with_predictions.png
    - plots/predictions/1449/goes_with_predictions.png
    - plots/predictions/185/goes_with_predictions.png
    - plots/predictions/2026/goes_with_predictions.png
    - plots/predictions/3153/goes_with_predictions.png
    - plots/predictions/3229/goes_with_predictions.png
    - plots/predictions/3364/goes_with_predictions.png
    - plots/predictions/3563/goes_with_predictions.png
    - plots/predictions/377/goes_with_predictions.png
    - plots/predictions/401/goes_with_predictions.png
    - plots/predictions/4296/goes_with_predictions.png
    - plots/predictions/4920/goes_with_predictions.png
    - plots/predictions/5894/goes_with_predictions.png
    - plots/predictions/833/goes_with_predictions.png
  plot-class-dist:
    cmd: python -m src.torch.vit.plot_class_wise_distribution
    deps:
    - data/intermediate-outs/attributions_neg.pt
    - data/intermediate-outs/attributions_pos.pt
    - solar_dataset.json
    - src/torch/vit/plot_class_wise_distribution.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    outs:
    - plots/distribution/131.pdf
    - plots/distribution/171.pdf
    - plots/distribution/193.pdf
    - plots/distribution/211.pdf
    - plots/distribution/304.pdf
    - plots/distribution/335.pdf
    - plots/distribution/94.pdf

  xgb-feat-importance:
    cmd: python -m src.torch.xgb_feat_importance
    deps:
    - outputs/deep-spaceship-10/best_xgboost_model.json
    - src/torch/xgb_feat_importance.py
    outs:
    - plots/xgb_feat_importance_gain.png
    - plots/xgb_feat_importance_weight.png
  plot_contour_image_grid:
    cmd: python -m src.torch.vit.plot_contour_image_grid
    deps:
    - outputs/glad-shape-197/trained_model.pth
    - solar_dataset.json
    - src/torch/vit/ig.py
    - src/torch/vit/plot_contour_image_grid.py
    - src/torch/vit/train.py
    - src/torch/vit/utils.py
    - stats.pkl
    outs:
    - plots/attribution_contour_grid.png
  create_movie:
    cmd: python -m src.torch.vit.create_movies
    deps:
    - outputs/glad-shape-197/trained_model.pth
    - solar_dataset.json
    - src/torch/vit/create_movies.py
    - src/torch/vit/ig.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/train.py
    - src/torch/vit/utils.py
    - stats.pkl
    outs:
    - tests_outputs/movie_131.mp4:
        cache: false
  attribution_analyzis:
    cmd: python -m src.torch.vit.attributions_analyze
    deps:
    - src/torch/vit/attributions_analyze.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/predictions_analyze.py
    - src/torch/vit/train.py
    - src/torch/vit/utils.py
    outs:
    - plots/predictions/1275/attributions_percentiles_99.png
    - plots/predictions/1449/attributions_percentiles_99.png
    - plots/predictions/185/attributions_percentiles_99.png
    - plots/predictions/2026/attributions_percentiles_99.png
    - plots/predictions/3153/attributions_percentiles_99.png
    - plots/predictions/3229/attributions_percentiles_99.png
    - plots/predictions/3364/attributions_percentiles_99.png
    - plots/predictions/3563/attributions_percentiles_99.png
    - plots/predictions/377/attributions_percentiles_99.png
    - plots/predictions/401/attributions_percentiles_99.png
    - plots/predictions/4296/attributions_percentiles_99.png
    - plots/predictions/4920/attributions_percentiles_99.png
    - plots/predictions/5894/attributions_percentiles_99.png
    - plots/predictions/833/attributions_percentiles_99.png
    - plots/predictions/1275/filtered_image_intensities.png
    - plots/predictions/1449/filtered_image_intensities.png
    - plots/predictions/185/filtered_image_intensities.png
    - plots/predictions/2026/filtered_image_intensities.png
    - plots/predictions/3153/filtered_image_intensities.png
    - plots/predictions/3229/filtered_image_intensities.png
    - plots/predictions/3364/filtered_image_intensities.png
    - plots/predictions/3563/filtered_image_intensities.png
    - plots/predictions/377/filtered_image_intensities.png
    - plots/predictions/401/filtered_image_intensities.png
    - plots/predictions/4296/filtered_image_intensities.png
    - plots/predictions/4920/filtered_image_intensities.png
    - plots/predictions/5894/filtered_image_intensities.png
    - plots/predictions/833/filtered_image_intensities.png
  confusion-matrix-val:
    cmd: python -m src.torch.vit.test --subset validation
    deps:
    - outputs/glad-shape-197/trained_model.pth
    - solar_dataset.json
    - src/torch/vit/test.py
    - stats.pkl
    outs:
    - plots/cm.png
  data-single:
    cmd: python -m src.data_single --process --select
    deps:
    - data/GOES_event_list.csv
    - data/aarps_full_urlist.txt
    - data/all_harps_with_noaa_ars.txt
    - src/data_single.py
    outs:
    - data/combined_clean.csv
    - data/combined_dl_list.csv
    - data/combined_processed_df.csv
    - data/goes_df_aarp_id.csv
    - data/grouped_df.csv
    - data/neg_urls_selected_downloaded.csv
    - data/pos_urls_selected_downloaded.csv
    - data/shape_limited.csv
  create-distribution:
    cmd: python -m src.torch.vit.class_wise_distribution
    deps:
    - outputs/glad-shape-197/trained_model.pth
    - solar_dataset.json
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    - stats.pkl
    outs:
    - data/intermediate-outs/attributions_neg.pt:
        cache: false
    - data/intermediate-outs/attributions_pos.pt:
        cache: false
  kshap-stats:
    cmd: python -m src.torch.vit.kshap
    deps:
    - src/torch/vit/kshap.py
    - aarp_ml/torch/dataset.py
    - aarp_ml/torch/model.py
    - outputs/glad-shape-197/trained_model.pth
    - solar_dataset.json
    - src/torch/vit/utils.py
    - stats.pkl
    outs:
    - shap_stats.json
    - plots/kshap/images:
        cache: false
  kshap-analyze:
    cmd: python -m src.torch.vit.analyze_shap
    deps:
    - src/torch/vit/analyze_shap.py
    - shap_stats.json
    outs:
    - plots/kshap/results

  # ── Subset pipeline stages ────────────────────────────────────────────────
  # Operates on a small locally-downloaded AARP subset (see src/aarp_subset_pipeline.py).
  # Run --download manually once before first dvc repro (external NASA fetch, not tracked).

  subset-data:
    cmd: python -m src.aarp_subset_pipeline --process --json
    deps:
    - src/aarp_subset_pipeline.py
    - data/grouped_df.csv
    - data/pos_urls_selected_downloaded.csv
    - data/neg_urls_selected_downloaded.csv
    - solar_dataset.json
    outs:
    - solar_dataset_subset.json

  subset-confusion-matrix:
    cmd: >-
      python -m src.torch.vit.test
      --subset test
      --json-path solar_dataset_subset.json
      --output-path plots/subset/cm.png
    deps:
    - src/torch/vit/test.py
    - solar_dataset_subset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - plots/subset/cm.png

  subset-prediction-plots:
    cmd: >-
      python -m src.torch.vit.predictions_analyze
      --json-path solar_dataset_subset.json
      --output-dir plots/subset/predictions
    deps:
    - src/torch/vit/predictions_analyze.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    - solar_dataset_subset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - plots/subset/predictions/377/goes_with_predictions.png
    - plots/subset/predictions/1449/goes_with_predictions.png

  subset-create-distribution:
    cmd: >-
      python -m src.torch.vit.class_wise_distribution
      --json-path solar_dataset_subset.json
      --output-neg data/intermediate-outs/subset_attributions_neg.pt
      --output-pos data/intermediate-outs/subset_attributions_pos.pt
    deps:
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    - solar_dataset_subset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - data/intermediate-outs/subset_attributions_neg.pt:
        cache: false
    - data/intermediate-outs/subset_attributions_pos.pt:
        cache: false

  subset-plot-class-dist:
    cmd: >-
      python -m src.torch.vit.plot_class_wise_distribution
      --json-path solar_dataset_subset.json
      --attributions-neg data/intermediate-outs/subset_attributions_neg.pt
      --attributions-pos data/intermediate-outs/subset_attributions_pos.pt
      --output-dir plots/subset/distribution
    deps:
    - src/torch/vit/plot_class_wise_distribution.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    - solar_dataset_subset.json
    - data/intermediate-outs/subset_attributions_neg.pt
    - data/intermediate-outs/subset_attributions_pos.pt
    outs:
    - plots/subset/distribution

  subset-attribution-analysis:
    cmd: >-
      python -m src.torch.vit.attributions_analyze
      --json-path solar_dataset_subset.json
      --output-dir plots/subset/predictions
    deps:
    - src/torch/vit/attributions_analyze.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/predictions_analyze.py
    - src/torch/vit/train.py
    - src/torch/vit/utils.py
    - solar_dataset_subset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - plots/subset/predictions/377/attributions_percentiles_99.png
    - plots/subset/predictions/377/filtered_image_intensities.png
    - plots/subset/predictions/1449/attributions_percentiles_99.png
    - plots/subset/predictions/1449/filtered_image_intensities.png

  subset-create-movie-377:
    cmd: >-
      python -m src.torch.vit.create_movies
      --json-path solar_dataset_subset.json
      --aarp-id 377
      --output-path plots/subset/movie_377_131.mp4
    deps:
    - src/torch/vit/create_movies.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    - solar_dataset_subset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - plots/subset/movie_377_131.mp4:
        cache: false

  subset-contour-grid:
    cmd: >-
      python -m src.torch.vit.plot_contour_image_grid
      --json-path solar_dataset_subset.json
      --aarp-id 377
      --output-path plots/subset/attribution_contour_grid.png
    deps:
    - src/torch/vit/plot_contour_image_grid.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    - solar_dataset_subset.json
    - outputs/glad-shape-197/trained_model.pth
    - stats.pkl
    outs:
    - plots/subset/attribution_contour_grid.png
