stages:
  prediction-plots:
    cmd: python -m vit.scripts.predictions_analyze
    deps:
    - output/glad-shape-197/trained_model.pth
    - solar_dataset.json
    - stats.pkl
    - vit/scripts/ig.py
    - vit/scripts/predictions_analyze.py
    outs:
    - pred-output/
  plot-class-dist:
    cmd: python -m vit.scripts.plot_class_wise_distribution
    deps:
    - data/intermediate-outs/attributions_neg.pt
    - data/intermediate-outs/attributions_pos.pt
    - solar_dataset.json
    - vit/scripts/plot_class_wise_distribution.py
    - vit/scripts/class_wise_distribution.py
    - vit/scripts/ig.py
    - vit/scripts/predictions_analyze.py
    outs:
    - plots/class_wise_int_dist_passband_131.png:
        cache: false
    - plots/class_wise_int_dist_passband_94.png:
        cache: false
