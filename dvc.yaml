stages:
  prediction-plots:
    cmd: python -m src.torch.vit.predictions_analyze
    deps:
    - outputs/glad-shape-197/trained_model.pth
    - solar_dataset.json
    - stats.pkl
    - src/torch/vit/ig.py
    - src/torch/vit/predictions_analyze.py
    outs:
    - pred-output/1275/goes_with_predictions.png
    - pred-output/1449/goes_with_predictions.png
    - pred-output/185/goes_with_predictions.png
    - pred-output/2026/goes_with_predictions.png
    - pred-output/3153/goes_with_predictions.png
    - pred-output/3229/goes_with_predictions.png
    - pred-output/3364/goes_with_predictions.png
    - pred-output/3563/goes_with_predictions.png
    - pred-output/377/goes_with_predictions.png
    - pred-output/401/goes_with_predictions.png
    - pred-output/4296/goes_with_predictions.png
    - pred-output/4920/goes_with_predictions.png
    - pred-output/5894/goes_with_predictions.png
    - pred-output/833/goes_with_predictions.png
  plot-class-dist:
    cmd: python -m src.torch.vit.plot_class_wise_distribution
    deps:
    - data/intermediate-outs/attributions_neg.pt
    - data/intermediate-outs/attributions_pos.pt
    - solar_dataset.json
    - src/torch/vit/plot_class_wise_distribution.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/utils.py
    outs:
    - plots/class_wise_int_dist_passband_131.png:
        cache: false
    - plots/class_wise_int_dist_passband_94.png:
        cache: false
  xgb-feat-importance:
    cmd: python -m src.torch.xgb_feat_importance
    deps:
    - outputs/deep-spaceship-10/best_xgboost_model.json
    - src/torch/xgb_feat_importance.py
    outs:
    - plots/xgb_feat_importance_gain.png
    - plots/xgb_feat_importance_weight.png
  plot_contour_image_grid:
    cmd: python -m src.torch.vit.plot_contour_image_grid
    deps:
    - outputs/glad-shape-197/trained_model.pth
    - solar_dataset.json
    - src/torch/vit/ig.py
    - src/torch/vit/plot_contour_image_grid.py
    - src/torch/vit/train.py
    - src/torch/vit/utils.py
    - stats.pkl
    outs:
    - plots/attribution_contour_grid.png
  create_movie:
    cmd: python -m src.torch.vit.create_movies
    deps:
    - outputs/glad-shape-197/trained_model.pth
    - solar_dataset.json
    - src/torch/vit/create_movies.py
    - src/torch/vit/ig.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/train.py
    - src/torch/vit/utils.py
    - stats.pkl
    outs:
    - tests_outputs/movie_131.mp4:
        cache: false
  attribution_analyzis:
    cmd: python -m src.torch.vit.attributions_analyze
    deps:
    - src/torch/vit/attributions_analyze.py
    - src/torch/vit/class_wise_distribution.py
    - src/torch/vit/ig.py
    - src/torch/vit/predictions_analyze.py
    - src/torch/vit/train.py
    - src/torch/vit/utils.py
    outs:
    - pred-output/1275/attributions_percentiles_99.png
    - pred-output/1449/attributions_percentiles_99.png
    - pred-output/185/attributions_percentiles_99.png
    - pred-output/2026/attributions_percentiles_99.png
    - pred-output/3153/attributions_percentiles_99.png
    - pred-output/3229/attributions_percentiles_99.png
    - pred-output/3364/attributions_percentiles_99.png
    - pred-output/3563/attributions_percentiles_99.png
    - pred-output/377/attributions_percentiles_99.png
    - pred-output/401/attributions_percentiles_99.png
    - pred-output/4296/attributions_percentiles_99.png
    - pred-output/4920/attributions_percentiles_99.png
    - pred-output/5894/attributions_percentiles_99.png
    - pred-output/833/attributions_percentiles_99.png
    - pred-output/1275/filtered_image_intensities.png
    - pred-output/1449/filtered_image_intensities.png
    - pred-output/185/filtered_image_intensities.png
    - pred-output/2026/filtered_image_intensities.png
    - pred-output/3153/filtered_image_intensities.png
    - pred-output/3229/filtered_image_intensities.png
    - pred-output/3364/filtered_image_intensities.png
    - pred-output/3563/filtered_image_intensities.png
    - pred-output/377/filtered_image_intensities.png
    - pred-output/401/filtered_image_intensities.png
    - pred-output/4296/filtered_image_intensities.png
    - pred-output/4920/filtered_image_intensities.png
    - pred-output/5894/filtered_image_intensities.png
    - pred-output/833/filtered_image_intensities.png
  confusion-matrix-val:
    cmd: python -m src.torch.vit.test --subset validation
    deps:
    - outputs/glad-shape-197/trained_model.pth
    - solar_dataset.json
    - src/torch/vit/test.py
    - stats.pkl
    outs:
    - plots/cm.png
  data-single:
    cmd: python -m src.data_single --process --select
    deps:
    - data/GOES_event_list.csv
    - data/aarps_full_urlist.txt
    - data/all_harps_with_noaa_ars.txt
    - src/data_single.py
    outs:
    - data/combined_clean.csv
    - data/combined_dl_list.csv
    - data/combined_processed_df.csv
    - data/goes_df_aarp_id.csv
    - data/grouped_df.csv
    - data/neg_urls_selected_downloaded.csv
    - data/pos_urls_selected_downloaded.csv
    - data/shape_limited.csv
